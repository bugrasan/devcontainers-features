name: "Release dev container features & Generate Documentation"
on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - ".github/workflows/release.yaml"
  workflow_dispatch:

jobs:
  # Publishing gate. Until now 'deploy' had no 'needs:', so a Feature whose
  # tests were failing still published to ghcr - 0fd401a records structurizr-cli
  # doing exactly that, broken across several releases. #38 made such failures
  # visible; this stops them shipping.
  #
  # Reuses test.yaml rather than restating its matrix, so the gate always tests
  # what CI tests. The cost is that a push to main which touches src/** runs the
  # suite twice - once for test.yaml directly, once through this gate. On free
  # runners for a ~2 minute suite that is a fair price for a gate that cannot
  # drift from CI.
  test:
    uses: ./.github/workflows/test.yaml
    permissions:
      contents: read

  deploy:
    needs: test
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      # contents: write covers both the ghcr publish and pushing the
      # regenerated docs to main. No pull-requests scope is needed any more -
      # this workflow no longer opens PRs.
      contents: write
      packages: write
    steps:
      # Full history: the documentation step below may need to rebase onto a
      # main that moved while this job was running, which a shallow clone
      # (checkout's default fetch-depth: 1) cannot do.
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: "Publish Features"
        uses: devcontainers/action@v1
        with:
          publish-features: "true"
          base-path-to-features: "./src"
          generate-docs: "true"
          
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Commit the regenerated READMEs straight back to main.
      #
      # This previously opened an "Automated documentation update" PR on every
      # release. Nothing ever merged them, so they accumulated - 14 were open
      # by Aug 2026, the oldest dating to 2024 - and each aged against a main
      # that had long moved on, so merging an old one would drag stale docs
      # back. The docs are mechanically derived from devcontainer-feature.json
      # + NOTES.md, so there is nothing to review: committing directly keeps
      # them in sync and leaves no backlog.
      #
      # This does NOT re-trigger this workflow, despite writing to src/**,
      # which the 'on.push.paths' filter above matches. Two independent guards:
      #   1. GitHub does not start new workflow runs for pushes made with the
      #      default GITHUB_TOKEN (its built-in recursion protection).
      #   2. The commit message carries [skip ci].
      # Either alone suffices; keep both, and keep [skip ci] in the message if
      # this is ever switched to a PAT or deploy key, which would defeat (1).
      #
      # CAUTION, and this has bitten this repo already: that marker is matched
      # anywhere in a commit message, not just on the first line, and it skips
      # EVERY workflow the commit would have triggered - not only this one. So
      # never write it literally in a commit message or in PR text that becomes
      # a squash-merge message. Commit 02bf143 did exactly that, quoting the
      # marker in prose while explaining this guard, and as a result its own
      # push to main started no runs at all: not release.yaml, not even
      # test.yaml, which has no path filter. It had to be published by hand via
      # workflow_dispatch. Describe it as "the skip-CI marker" in prose instead.
      # https://docs.github.com/en/actions/how-tos/manage-workflow-runs/skip-workflow-runs
      - name: Commit documentation updates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'

          # Only the generated docs - never anything else the publish step or a
          # Feature's install may have touched in the working tree.
          git add -- 'src/*/README.md'

          if git diff --cached --quiet; then
              echo "Documentation is already up to date - nothing to commit."
              exit 0
          fi

          echo "Documentation changes to commit:"
          git diff --cached --stat

          git commit -m 'Automated documentation update [skip ci]'

          # Another release can land on main while this job runs, making the
          # push a non-fast-forward. Rebase onto the new tip and retry.
          for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                  echo "Documentation update pushed to main."
                  exit 0
              fi
              echo "Push rejected (attempt ${attempt}/3); rebasing onto the latest main..."
              git pull --rebase origin main
          done

          echo "ERROR: could not push the documentation update to main after 3 attempts." >&2
          exit 1
